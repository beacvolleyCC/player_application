name: Player MRSZ standings QA
on:
  push:
    branches: [main]
    paths:
      - app.js
      - statistics.js
      - styles.css
      - statistics.css
      - index.html
      - sw.js
      - tests/mrsz-standings.test.cjs
      - tests/player-statistics-wl.test.cjs
      - competition-context-catalog.js
      - tests/competition-context-catalog.test.cjs
      - tests/league-context-ui.test.cjs
      - .github/workflows/player-mrsz-standings.yml
  pull_request:
    paths:
      - app.js
      - statistics.js
      - styles.css
      - statistics.css
      - index.html
      - sw.js
      - tests/mrsz-standings.test.cjs
      - tests/player-statistics-wl.test.cjs
      - competition-context-catalog.js
      - tests/competition-context-catalog.test.cjs
      - tests/league-context-ui.test.cjs
      - .github/workflows/player-mrsz-standings.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mrsz-standings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Player script
        run: node --check app.js
      - name: Parse Player statistics script
        run: node --check statistics.js
      - name: Check source standings, fixtures and scores
        run: node --test tests/mrsz-standings.test.cjs
      - name: Validate player W/L and K/CS roster statistics
        run: node --test tests/player-statistics-wl.test.cjs
      - name: Validate canonical competition contexts
        run: node --test tests/competition-context-catalog.test.cjs
      - name: Check league context UI
        run: node --test tests/league-context-ui.test.cjs
