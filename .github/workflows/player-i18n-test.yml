name: Player HU-EN language QA (TEST only)
on:
  push:
    branches:
      - feat/player-i18n-en-test-20261110
    paths:
      - 'app.js'
      - 'statistics.js'
      - 'i18n*.js'
      - 'index.html'
      - 'sw.js'
      - 'config.js'
      - 'scripts/build-cloudflare-test.cjs'
      - 'tests/i18n.test.js'
      - 'tests/player-i18n-ui.test.cjs'
      - 'tests/player-i18n-coverage.test.cjs'
      - '.github/workflows/player-i18n-test.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'statistics.js'
      - 'i18n*.js'
      - 'index.html'
      - 'sw.js'
      - 'scripts/build-cloudflare-test.cjs'
      - 'tests/i18n.test.js'
      - 'tests/player-i18n-ui.test.cjs'
      - 'tests/player-i18n-coverage.test.cjs'
      - '.github/workflows/player-i18n-test.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check statistics.js
          node --check i18n.js
          node --check i18n-static.js
          node --check i18n-dom.js
          node --check sw.js
      - name: Check player bilingual UI and isolated TEST configuration
        run: node --test tests/i18n.test.js tests/player-i18n-ui.test.cjs tests/player-i18n-coverage.test.cjs
      - name: Build isolated Cloudflare TEST preview (never deploy)
        run: |
          node scripts/build-cloudflare-test.cjs
          test -f dist-test/index.html
          test -f dist-test/i18n-static.js
          test -f dist-test/config.js
      - name: Check match, standings and protocol regressions
        run: |
          node --test tests/mrsz-standings.test.cjs
          node --test tests/player-statistics-wl.test.cjs
          node --test tests/competition-context-catalog.test.cjs
          node --test tests/league-context-ui.test.cjs
          node --test tests/protocol-match-order-20261019.test.cjs
      - name: Upload isolated TEST preview (not published)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: club-control-player-huen-test-preview
          path: dist-test/
          if-no-files-found: error
          retention-days: 7

  deploy-test:
    name: Deploy Player to isolated Cloudflare TEST project
    needs: verify
    # Never run this deployment from main, pull requests or an unverified build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/player-i18n-en-test-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether TEST-only Cloudflare deploy credentials are configured
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CF_ACCOUNT" && -n "$CF_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare TEST deployment not started" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing CLOUDFLARE_ACCOUNT_ID and/or CLOUDFLARE_API_TOKEN in GitHub Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure a token with Pages Write permission and create the isolated project cc-player-test-beac." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build isolated TEST Player
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/build-cloudflare-test.cjs
      - name: Publish only to cc-player-test-beac
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-test --project-name=cc-player-test-beac --branch=feat/player-i18n-en-test-20261110
      - name: Report the real deployment address
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        shell: bash
        run: |
          echo "### Player TEST deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview alias: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE is not modified." >> "$GITHUB_STEP_SUMMARY"
