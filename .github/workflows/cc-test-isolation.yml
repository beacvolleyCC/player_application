name: CC Player mobile isolation checks
on:
  push:
    branches: [test/20261026-isolated-player-mobile]
  pull_request:
    paths: ['index.html','config.js','manifest.webmanifest','sw.js','scripts/verify-test-isolation.cjs']
jobs:
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app.js
          node --check sw.js
          node scripts/verify-test-isolation.cjs
